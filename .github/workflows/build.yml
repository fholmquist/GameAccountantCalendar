name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - run: dotnet restore GameAccountantCalendar.slnx

      - run: dotnet build GameAccountantCalendar.slnx --no-restore --configuration Release

      - run: dotnet test GameAccountantCalendar.slnx --no-build --configuration Release --verbosity normal
